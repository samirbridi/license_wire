# Broker MQTT para o Home Assistant + ponte Mizin Home. Sem allow_anonymous: só quem tem usuário/senha
# (ver passwd, gerado por bootstrap.sh) consegue publicar/assinar -- o broker fica exposto na LAN (porta
# 1883 no compose), então autenticação é obrigatória, não opcional.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
