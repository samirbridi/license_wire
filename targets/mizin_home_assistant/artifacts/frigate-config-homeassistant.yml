# Variante "pronta para o Home Assistant" de
# targets/tuya_smartlife/reconstructed/mizin-vision/config/config.yml -- MESMO conteúdo, só com o bloco
# mqtt ligado (ver nota de TESTADO abaixo). NÃO copiar isto por cima do config local de testes: os dois
# arquivos precisam continuar divergindo neste único ponto até decidir onde o Frigate roda de fato.
#
# DUAS coisas ainda pendentes antes deste arquivo valer para uso real (não são bugs, são decisões que
# dependem da máquina nova existir -- ver notes/02_decisao_hardware.md e notes/03_cameras_no_ha.md):
#   1. As câmeras abaixo ainda apontam para os arquivos de amostra em /samples (gravação gravada, em
#      loop) -- a ligação com o vídeo AO VIVO da ponte do NAS (go2rtc) depende da porta liberada só
#      para a máquina que roda o Frigate, decisão já tomada para este PC (GTX) mas que precisa ser
#      refeita para a máquina nova, se o Frigate for rodar lá.
#   2. `detectors.onnx` assume uma GPU NVIDIA (CUDA). Na RX 580 isso não existe: ver decisão de hardware
#      para rodar continuar na GTX deste PC (recomendado agora) ou trocar para `detectors.cpu` nesta
#      máquina nova (mais lento, sem GPU dedicada -- ver notes/02_decisao_hardware.md para números).
#
# TESTADO (2026-11-01, banco de testes local): `mqtt.enabled: true` com `host: "{FRIGATE_MQTT_HOST}"` e
# a env var ausente DERRUBA o container inteiro com `KeyError: 'FRIGATE_MQTT_HOST'` -- não degrada
# graciosamente. As três env vars abaixo (FRIGATE_MQTT_HOST/USER/PASSWORD) são obrigatórias no ambiente
# do container antes de subir com este arquivo, nunca opcionais.
mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"   # ex: mizin-mosquitto, se Frigate e o broker estiverem no mesmo compose
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

database:
  path: /media/frigate/frigate.db

detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: false   # a gravação continua no NAS (ver recorder/camera-archive.mjs), inalterada: o Frigate
                    # aqui só detecta e notifica, para não duplicar armazenamento nem I/O de disco à toa.
snapshots:
  enabled: true
  retain:
    default: 7

objects:
  track: [person, car, motorcycle, bicycle]

lpr:
  enabled: true
  detection_threshold: 0.7
  recognition_threshold: 0.9
  min_area: 1000
  min_plate_length: 7
  model_size: small
  format: "^([A-Z]{3}[0-9]{4}|[A-Z]{3}[0-9][A-Z][0-9]{2})$"
  match_distance: 0
  known_plates:
    GWM Ora 5 (Preto):
      - "TRL4I59"
    BYD Dolphin Mini (Preto):
      - "TQR1A36"
    Renault Scenic (Preta):
      - "IQL8380"

# Mesmas 3 câmeras de amostra do banco de testes local -- ver pendência (1) no topo deste arquivo antes
# de considerar isto "ao vivo". Trocar os `inputs.path` por `rtsp://<ip-da-ponte>:8554/<alias>` (go2rtc
# restream) é o único passo que falta, uma vez que a porta esteja liberada.
cameras:
  aw300_portao:
    ffmpeg:
      hwaccel_args: preset-nvidia   # trocar para preset-vaapi se a detecção rodar na RX 580, não na GTX
      input_args: -re -stream_loop -1 -fflags +genpts
      inputs:
        - path: /samples/aw300_portao_2026-10-30_orfao_0e923448-000001.mkv
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.28,0,0.28,0.06,0,0.06
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
  outdoor_rua:
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: -re -stream_loop -1 -fflags +genpts
      inputs:
        - path: /samples/cuts/outdoor_v2_1403.mkv
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.38,0,0.38,0.08,0,0.08
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
  outdoor_calcada:
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: -re -stream_loop -1 -fflags +genpts
      inputs:
        - path: /samples/cuts/outdoor_v1_1403.mkv
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.38,0,0.38,0.08,0,0.08
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
  garagem_portao:
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: -re -stream_loop -1 -fflags +genpts
      inputs:
        - path: /samples/cuts/aw300_garagem_1403.mkv
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.27,0,0.27,0.05,0,0.05
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
version: 0.18-0
