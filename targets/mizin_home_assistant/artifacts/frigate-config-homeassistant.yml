# Variante "pronta para o Home Assistant" de
# targets/tuya_smartlife/reconstructed/mizin-vision/config/config-live.yml (câmeras ao vivo via RTSP da
# ponte go2rtc do NAS, já validado em bancada -- ver 04_passo_a_passo_remoto.md item 4a) -- MESMO
# conteúdo, só com o bloco mqtt ligado. NÃO copiar isto por cima do config-live.yml local: os dois
# arquivos precisam continuar divergindo neste único ponto até decidir onde o Frigate roda de fato.
#
# UMA coisa ainda pendente antes deste arquivo valer para uso real (não é bug, é decisão que depende da
# máquina nova existir -- ver notes/02_decisao_hardware.md):
#   `detectors.onnx` assume uma GPU NVIDIA (CUDA). Na RX 580 isso não existe: a recomendação atual é
#   continuar na GTX deste PC (ver notes/02_decisao_hardware.md para os números). Se isso mudar,
#   trocar `hwaccel_args: preset-nvidia` por `preset-vaapi` em cada câmera abaixo.
#
# TESTADO (2026-11-01, banco de testes local): `mqtt.enabled: true` com `host: "{FRIGATE_MQTT_HOST}"` e
# a env var ausente DERRUBA o container inteiro com `KeyError: 'FRIGATE_MQTT_HOST'` -- não degrada
# graciosamente. As três env vars abaixo (FRIGATE_MQTT_HOST/USER/PASSWORD) são obrigatórias no ambiente
# do container antes de subir com este arquivo, nunca opcionais. O mesmo vale para
# {FRIGATE_RTSP_USER}/{FRIGATE_RTSP_PASSWORD} usadas nas câmeras abaixo.
mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}"   # ex: mizin-mosquitto, se Frigate e o broker estiverem no mesmo compose
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

database:
  path: /media/frigate/frigate.db

detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: false   # a gravação continua no NAS (ver recorder/camera-archive.mjs), inalterada: o Frigate
                    # aqui só detecta e notifica, para não duplicar armazenamento nem I/O de disco à toa.
snapshots:
  enabled: true
  retain:
    default: 7

objects:
  track: [person, car, motorcycle, bicycle]

lpr:
  enabled: true
  detection_threshold: 0.7
  recognition_threshold: 0.9
  min_area: 1000
  min_plate_length: 7
  model_size: small
  format: "^([A-Z]{3}[0-9]{4}|[A-Z]{3}[0-9][A-Z][0-9]{2})$"
  match_distance: 0
  known_plates:
    GWM Ora 5 (Preto):
      - "TRL4I59"
    BYD Dolphin Mini (Preto):
      - "TQR1A36"
    Renault Scenic (Preta):
      - "IQL8380"

# As 4 entradas (3 câmeras físicas, Outdoor com 2 lentes) via RTSP da ponte go2rtc do NAS, idêntico a
# config-live.yml. preset-rtsp-restream: feito especificamente para consumir um restream go2rtc, não o
# preset genérico de câmera IP.
cameras:
  aw300_portao:
    ffmpeg:
      hwaccel_args: preset-nvidia   # trocar para preset-vaapi se a detecção rodar na RX 580, não na GTX
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/aw300_portao_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.28,0,0.28,0.06,0,0.06
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
  outdoor_rua:   # Outdoor Pro, segunda lente (rua/calçada em frente ao portão)
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/outdoor_pro_poste_channel2_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.38,0,0.38,0.08,0,0.08
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
  outdoor_calcada:   # Outdoor Pro, primeira lente (calçada junto ao muro)
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/outdoor_pro_poste_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.38,0,0.38,0.08,0,0.08
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
  garagem_portao:   # AW300 Garagem, olhando de dentro para o portão
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/aw300_garagem_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.27,0,0.27,0.05,0,0.05
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
version: 0.18-0
