services:
  prepare:
    image: debian:bookworm-slim
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u=rwX,go= /data"]
    network_mode: none
    restart: "no"
    volumes:
      - ./data:/data
  bridge:
    image: homecams-central:local
    command: ["/bridge/go2rtc-linux-amd64", "-config", "/data/bridge.yaml"]
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - ./bridge:/bridge:ro
      - ./data/bridge:/data
  central:
    image: homecams-central:local
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      bridge:
        condition: service_started
    volumes:
      - ./data/central:/data
    tmpfs: [/tmp]
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: ["tunnel", "--no-autoupdate", "--protocol", "quic", "run", "--token-file", "/run/secrets/tunnel.token"]
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - ./data/tunnel.token:/run/secrets/tunnel.token:ro
