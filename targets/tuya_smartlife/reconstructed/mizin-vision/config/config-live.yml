# Mizin Vision — configuração AO VIVO (Frigate 0.18.2). NÃO está em uso por padrão -- ver
# docker-compose.local.yml, que monta config.yml (amostras em loop) e não este arquivo. Para ligar o
# modo ao vivo, ver targets/mizin_home_assistant/artifacts/bridge-rtsp-enable.md e bridge-firewall-dsm.md
# primeiro (a porta RTSP da ponte ainda está fechada por padrão; sem essas duas mudanças aplicadas no
# NAS, este arquivo não vai conseguir conectar em lugar nenhum).
#
# Diferença real contra config.yml: só a seção `cameras` (aponta para rtsp://192.168.1.186:8554/<alias>
# em vez dos arquivos de amostra em /samples). mqtt, detectors, model, lpr, record, snapshots, objects
# são idênticos -- qualquer mudança feita ali também deve ser replicada aqui manualmente até os dois
# arquivos serem unificados (não foram unificados agora de propósito: evita qualquer risco de um erro
# de digitação neste arquivo novo afetar o banco de testes que já funciona).
mqtt:
  enabled: false   # mesmo estado do config.yml: sem broker nesta máquina ainda (ver notes/02_decisao_hardware.md)

database:
  path: /media/frigate/frigate.db

detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 320
  height: 320
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-s-320.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: false   # a gravação continua no NAS (recorder/camera-archive.mjs), não duplicada aqui
snapshots:
  enabled: true
  retain:
    default: 7

objects:
  track: [person, car, motorcycle, bicycle]

lpr:
  enabled: true
  detection_threshold: 0.7
  recognition_threshold: 0.9
  min_area: 1000
  min_plate_length: 7
  model_size: small
  format: "^([A-Z]{3}[0-9]{4}|[A-Z]{3}[0-9][A-Z][0-9]{2})$"
  match_distance: 0
  known_plates:
    GWM Ora 5 (Preto):
      - "TRL4I59"
    BYD Dolphin Mini (Preto):
      - "TQR1A36"
    Renault Scenic (Preta):
      - "IQL8380"

# As 3 câmeras físicas do escopo de segurança (4 entradas: Outdoor tem 2 lentes), lendo via RTSP da
# ponte go2rtc do NAS (preset-rtsp-restream: feito especificamente para consumir um restream go2rtc,
# não o preset genérico de câmera IP). {FRIGATE_RTSP_USER}/{FRIGATE_RTSP_PASSWORD} vêm do
# docker-compose.local-live.yml -- SEMPRE definidas lá, mesmo que vazias por padrão: uma env var ausente
# (não apenas vazia) derruba o container inteiro com KeyError, testado nesta sessão.
cameras:
  aw300_portao:
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/aw300_portao_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.28,0,0.28,0.06,0,0.06
    detect: {enabled: true, width: 1280, height: 720, fps: 5}

  outdoor_rua:   # Outdoor Pro, segunda lente (rua/calçada em frente ao portão)
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/outdoor_pro_poste_channel2_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.38,0,0.38,0.08,0,0.08
    detect: {enabled: true, width: 1280, height: 720, fps: 5}

  outdoor_calcada:   # Outdoor Pro, primeira lente (calçada junto ao muro)
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/outdoor_pro_poste_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.38,0,0.38,0.08,0,0.08
    detect: {enabled: true, width: 1280, height: 720, fps: 5}

  garagem_portao:   # AW300 Garagem, olhando de dentro para o portão
    ffmpeg:
      hwaccel_args: preset-nvidia
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.186:8554/aw300_garagem_quality3
          roles: [detect]
    motion:
      mask:
        relogio:
          friendly_name: Relógio da câmera
          coordinates: 0,0,0.27,0,0.27,0.05,0,0.05
    detect: {enabled: true, width: 1280, height: 720, fps: 5}
version: 0.18-0
